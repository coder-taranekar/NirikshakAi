# ─────────────────────────────────────────────────────────────────
# LabelGuard — Nginx Reverse Proxy Configuration
#
# Routes:
#   /api/*       → FastAPI backend (port 8000)
#   /docs        → FastAPI Swagger UI (dev only)
#   /openapi.json→ FastAPI OpenAPI schema (dev only)
#   /*           → React web frontend (port 3000)
#   /minio/*     → MinIO API (port 9000) — internal only
#
# Usage (production):
#   docker-compose up nginx
# ─────────────────────────────────────────────────────────────────

# Number of worker processes (auto = one per CPU core)
worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json
                       application/javascript text/xml
                       application/xml application/xml+rss text/javascript;

    # ── File Upload Size ──────────────────────────────────────────
    # Allow up to 20MB for label image uploads
    client_max_body_size 20M;

    # ── Upstream Definitions ──────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server web:3000;
        keepalive 16;
    }

    # ── Rate Limiting Zones ───────────────────────────────────────
    # 10 requests/second per IP for API; burst of 20 queued
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── Main Server Block ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options           "SAMEORIGIN"            always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header X-XSS-Protection          "1; mode=block"         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── API Routes → FastAPI Backend ──────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts — allow longer for OCR processing
            proxy_connect_timeout  60s;
            proxy_send_timeout     120s;
            proxy_read_timeout     120s;
        }

        # ── FastAPI Docs (strip /api prefix) ──────────────────────
        location /docs {
            proxy_pass         http://backend/docs;
            proxy_set_header   Host $host;
        }

        location /openapi.json {
            proxy_pass         http://backend/openapi.json;
            proxy_set_header   Host $host;
        }

        location /health {
            proxy_pass         http://backend/health;
            proxy_set_header   Host $host;
            # No rate limiting on health checks
        }

        # ── React Web Frontend ────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade     $http_upgrade;
            proxy_set_header   Connection  "upgrade";
            proxy_set_header   Host        $host;
            proxy_cache_bypass $http_upgrade;

            # SPA fallback — serve index.html for all unknown routes
            try_files $uri $uri/ @frontend_fallback;
        }

        location @frontend_fallback {
            proxy_pass http://frontend;
        }

        # ── Static Assets Cache ───────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://frontend;
            expires            1y;
            add_header         Cache-Control "public, immutable";
        }

        # ── Block access to hidden files ──────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
